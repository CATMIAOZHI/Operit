name: Android Build

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: Gradle task to run
        required: true
        default: ':app:assembleDebug'
        type: choice
        options:
          - ':app:assembleDebug'
          - ':app:assembleNightly'
          - ':app:assembleClone'
          - ':app:assembleRelease'
          - ':app:bundleRelease'
      run_unit_tests:
        description: Run JVM unit tests after the build
        required: false
        default: false
        type: boolean
      run_android_lint:
        description: Run Android lint after the build
        required: false
        default: false
        type: boolean
  push:
    branches: [personal/main]
    paths:
      - .github/actions/android-checks/**
      - .github/workflows/android-build.yml
      - .gitmodules
      - .npmrc
      - app/**
      - build.gradle.kts
      - ci/script/download_android_dependencies.sh
      - ci/script/prepare_android_dependencies.py
      - ci/script/run_android_checks.sh
      - cmake/**
      - dragonbones/**
      - examples/**
      - fbx/**
      - gradle/**
      - gradle.properties
      - gradlew
      - gradlew.bat
      - llama/**
      - mmd/**
      - mnn/**
      - package.json
      - package-lock.json
      - npm-shrinkwrap.json
      - pnpm-workspace.yaml
      - quickjs/**
      - settings.gradle.kts
      - showerclient/**
      - terminal/**
      - terminal
      - tools/native_ripgrep/**
      - tools/example_packages/packages_whitelist.txt
      - tools/example_packages/legacy_incompatible_packages.txt
      - tools/example_packages/sync_example_packages.py
      - tools/adb/execute_js.bat
      - tools/adb/execute_js.sh
      - tools/adb/execute_js_dir.bat
      - tools/adb/execute_js_dir.sh
      - tools/adb/run_sandbox_script.bat
      - tools/adb/run_sandbox_script.sh
      - tools/sandboxpackage_dev_install_or_update.js
      - web-chat/**

concurrency:
  group: android-build-${{ github.event_name }}-${{ github.ref }}-${{ github.event.inputs.gradle_task }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  ANDROID_NDK_VERSION: '25.1.8937393'
  ANDROID_CMAKE_VERSION: '3.22.1'
  MANUAL_DEPS_DIR: manual-deps
  OPERIT_RELEASE_CERT_SHA256: '40:F8:7A:4D:66:EB:70:D0:E2:D1:37:9C:6A:97:DD:DC:0C:ED:D3:BA:87:2E:02:74:50:CA:77:AF:42:EC:5E:74'

jobs:
  build:
    name: Build Android artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Prepare full Android environment
        uses: ./.github/actions/android-checks
        with:
          lane: full
          java-version: ${{ env.JAVA_VERSION }}
          android-build-tools-version: '35.0.0'
          android-ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          android-cmake-version: ${{ env.ANDROID_CMAKE_VERSION }}
          manual-deps-dir: ${{ env.MANUAL_DEPS_DIR }}
          gradle-cache-read-only: 'false'
          dependency-cache-read-only: 'false'
          configure-local-properties: 'false'
          additional-sdk-packages: build-tools;34.0.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install -g pnpm@10.34.5
          npm ci --no-audit --no-fund
          npm --prefix web-chat ci --no-audit --no-fund

      - name: Build WebChat assets
        run: |
          npm --prefix web-chat run typecheck
          npm run build:webchat

      - name: Build bundled ToolPkg packages
        run: |
          npm run build:examples:github
          git diff --exit-code -- examples/github.js
          python3 tools/example_packages/sync_example_packages.py --no-hot-reload
          git diff --exit-code -- ':(glob)examples/*.js' ':(glob)app/src/main/assets/packages/*.js'
          untracked="$(git ls-files --others --exclude-standard -- ':(glob)examples/*.js' ':(glob)app/src/main/assets/packages/*.js')"
          if [[ -n "$untracked" ]]; then
            echo "Untracked ToolPkg outputs generated by sync (commit them or fix sources):" >&2
            echo "$untracked" >&2
            exit 1
          fi

      - name: Configure Android build
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.OPERIT_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.OPERIT_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.OPERIT_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.OPERIT_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?OPERIT_RELEASE_KEYSTORE_BASE64 is required}"
          : "${RELEASE_STORE_PASSWORD:?OPERIT_RELEASE_STORE_PASSWORD is required}"
          : "${RELEASE_KEY_ALIAS:?OPERIT_RELEASE_KEY_ALIAS is required}"
          : "${RELEASE_KEY_PASSWORD:?OPERIT_RELEASE_KEY_PASSWORD is required}"

          release_keystore="$RUNNER_TEMP/operit-ry-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$release_keystore"
          chmod 600 "$release_keystore"

          actual_cert_sha256="$(
            keytool -list -v \
              -keystore "$release_keystore" \
              -storepass "$RELEASE_STORE_PASSWORD" \
              -alias "$RELEASE_KEY_ALIAS" \
              | sed -n 's/^[[:space:]]*SHA256: //p'
          )"
          if [[ "$actual_cert_sha256" != "$OPERIT_RELEASE_CERT_SHA256" ]]; then
            echo "Release signing certificate does not match Operit Ry." >&2
            exit 1
          fi

          umask 077
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo 'GITHUB_CLIENT_ID='
            echo 'GITHUB_CLIENT_SECRET='
            echo "RELEASE_STORE_FILE=$release_keystore"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } > local.properties

      - name: Run Gradle build and checks
        id: gradle-build
        env:
          DISPATCH_GRADLE_TASK: ${{ inputs.gradle_task }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_UNIT_TESTS: ${{ inputs.run_unit_tests }}
          RUN_ANDROID_LINT: ${{ inputs.run_android_lint }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)
              bash ci/script/run_android_checks.sh --lane full --continue
              ;;
            workflow_dispatch)
              flags=(--lane build --task "$DISPATCH_GRADLE_TASK" --continue)
              [[ "$RUN_UNIT_TESTS" == "true" ]] && flags+=(--unit-tests)
              [[ "$RUN_ANDROID_LINT" == "true" ]] && flags+=(--lint)
              bash ci/script/run_android_checks.sh "${flags[@]}"
              ;;
            *) echo "Unsupported workflow event: $EVENT_NAME" >&2; exit 2 ;;
          esac

      - name: Verify Android artifact signatures
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          artifacts=(
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          )
          if (( ${#artifacts[@]} == 0 )); then
            echo 'The Android build produced no APK or AAB artifact.' >&2
            exit 1
          fi

          expected_apk_digest="${OPERIT_RELEASE_CERT_SHA256//:/}"
          expected_apk_digest="${expected_apk_digest,,}"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for artifact in "${artifacts[@]}"; do
            case "$artifact" in
              *.apk)
                certificate="$("$apksigner" verify --print-certs "$artifact")"
                grep -Fqi "Signer #1 certificate SHA-256 digest: $expected_apk_digest" <<< "$certificate"
                ;;
              *.aab)
                jarsigner -verify "$artifact"
                certificate="$(keytool -printcert -jarfile "$artifact")"
                grep -Fq "SHA256: $OPERIT_RELEASE_CERT_SHA256" <<< "$certificate"
                ;;
            esac
          done

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: operit-android-reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload successful Android outputs
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: operit-android-${{ github.run_number }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14
