name: PR Check

on:
  pull_request:
    branches: [personal/main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  ANDROID_BUILD_TOOLS_VERSION: '35.0.0'

jobs:
  plan:
    name: Plan candidate checks
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      changed_count: ${{ steps.plan.outputs.changed_count }}
      localization: ${{ steps.plan.outputs.localization }}
      android_resources: ${{ steps.plan.outputs.android_resources }}
      android_jvm: ${{ steps.plan.outputs.android_jvm }}
      android_instrumentation: ${{ steps.plan.outputs.android_instrumentation }}
      android_full: ${{ steps.plan.outputs.android_full }}
      web: ${{ steps.plan.outputs.web }}
      toolpkg: ${{ steps.plan.outputs.toolpkg }}
      docs: ${{ steps.plan.outputs.docs }}
      yaml: ${{ steps.plan.outputs.yaml }}
      ci: ${{ steps.plan.outputs.ci }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      candidate_sha: ${{ steps.plan.outputs.candidate_sha }}

    steps:
      - name: Checkout merge candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Plan candidate checks
        id: plan
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 ci/script/pr_check.py plan \
            --candidate "$CANDIDATE_SHA" \
            --expected-base "$EXPECTED_BASE_SHA" \
            --expected-head "$EXPECTED_HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

  fast-checks:
    name: Fast checks
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout merge candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Check gate implementation
        id: gate-tests
        continue-on-error: true
        run: python3 -B -m unittest discover -s ci/test -p 'test_*.py'

      - name: Check repository hygiene
        id: hygiene
        continue-on-error: true
        run: |
          python3 ci/script/check_repo_hygiene.py \
            --base "${{ needs.plan.outputs.base_sha }}" \
            --candidate "${{ needs.plan.outputs.candidate_sha }}"

      - name: Check Android lint baseline
        id: lint-baseline
        continue-on-error: true
        run: python3 ci/script/normalize_lint_baseline.py --check

      - name: Check Markdown links
        id: markdown
        continue-on-error: true
        run: |
          python3 ci/script/check_markdown_links.py \
            --base "${{ needs.plan.outputs.base_sha }}" \
            --candidate "${{ needs.plan.outputs.candidate_sha }}"

      - name: Check localization changes
        id: localization
        if: needs.plan.outputs.localization == 'true'
        continue-on-error: true
        run: |
          python3 ci/script/check_localizations.py \
            --base "${{ needs.plan.outputs.base_sha }}" \
            --candidate "${{ needs.plan.outputs.candidate_sha }}"

      - name: Check changed YAML and Actions workflows
        id: yaml
        if: needs.plan.outputs.yaml == 'true'
        continue-on-error: true
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.plan.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          yaml_list="$RUNNER_TEMP/changed-yaml.list"
          git diff --name-only --no-renames --diff-filter=ACMRT -z \
            "$BASE_SHA" "$CANDIDATE_SHA" -- '*.yml' '*.yaml' > "$yaml_list"
          mapfile -d '' -t yaml_files < "$yaml_list"

          workflow_list="$RUNNER_TEMP/changed-workflows.list"
          : > "$workflow_list"
          if (( ${#yaml_files[@]} == 0 )); then
            echo "No added or modified YAML files."
            exit 0
          fi

          # AST parsing validates syntax without converting valid scalars into Ruby objects.
          ruby -rpsych -e \
            'ARGV.each { |path| Psych.parse_file(path); puts "YAML OK: #{path}" }' \
            -- "${yaml_files[@]}"

          for path in "${yaml_files[@]}"; do
            case "$path" in
              .github/workflows/*.yml|.github/workflows/*.yaml)
                printf '%s\0' "$path" >> "$workflow_list"
                ;;
            esac
          done

          if [[ -s "$workflow_list" ]]; then
            mapfile -d '' -t workflow_files < "$workflow_list"
            actionlint_archive="$RUNNER_TEMP/actionlint.tar.gz"
            actionlint_dir="$RUNNER_TEMP/actionlint"
            curl --fail --location --silent --show-error \
              "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
              --output "$actionlint_archive"
            echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $actionlint_archive" \
              | sha256sum --check --strict
            mkdir -p "$actionlint_dir"
            tar -xzf "$actionlint_archive" -C "$actionlint_dir"
            "$actionlint_dir/actionlint" "${workflow_files[@]}"
          fi

      - name: Require successful fast checks
        if: always()
        env:
          PLAN_OUTCOME: ${{ needs.plan.result }}
          GATE_TESTS_OUTCOME: ${{ steps.gate-tests.outcome }}
          HYGIENE_OUTCOME: ${{ steps.hygiene.outcome }}
          LINT_BASELINE_OUTCOME: ${{ steps.lint-baseline.outcome }}
          MARKDOWN_OUTCOME: ${{ steps.markdown.outcome }}
          LOCALIZATION_OUTCOME: ${{ steps.localization.outcome }}
          YAML_OUTCOME: ${{ steps.yaml.outcome }}
          YAML_REQUIRED: ${{ needs.plan.outputs.yaml }}
        shell: bash
        run: |
          set -euo pipefail
          failures=0

          check_stage() {
            local name="$1"
            local required="$2"
            local outcome="$3"
            printf '| <code>%s</code> | <code>%s</code> | <code>%s</code> |\n' \
              "$name" "$required" "$outcome" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$required" == "true" && "$outcome" != "success" ]]; then
              echo "Required fast check failed: $name ($outcome)" >&2
              failures=$((failures + 1))
            fi
          }

          {
            echo "## Fast check decision"
            echo
            echo '| Stage | Required | Outcome |'
            echo '| --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"

          check_stage candidate true "$PLAN_OUTCOME"
          check_stage gate-tests true "$GATE_TESTS_OUTCOME"
          check_stage hygiene true "$HYGIENE_OUTCOME"
          check_stage lint-baseline true "$LINT_BASELINE_OUTCOME"
          check_stage markdown true "$MARKDOWN_OUTCOME"
          check_stage localization false "$LOCALIZATION_OUTCOME"
          check_stage yaml "$YAML_REQUIRED" "$YAML_OUTCOME"

          if (( failures > 0 )); then
            exit 1
          fi

  android-resources:
    name: Android resources
    needs: [plan, fast-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: needs.plan.outputs.android_resources == 'true'

    steps:
      - name: Checkout merge candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install build-tools
        shell: bash
        run: sdkmanager --install "build-tools;$ANDROID_BUILD_TOOLS_VERSION"

      - name: Compile changed Android resources
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/compiled-app-resources.zip"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/aapt2" compile \
            --dir app/src/main/res \
            -o "$output"
          test -s "$output"

  web:
    name: WebChat
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: needs.plan.outputs.web == 'true'

    steps:
      - name: Checkout merge candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web-chat/package-lock.json

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix web-chat ci --no-audit --no-fund

      - name: Check WebChat
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix web-chat run typecheck
          npm run build:webchat

  toolpkg:
    name: ToolPkg
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: needs.plan.outputs.toolpkg == 'true'

    steps:
      - name: Checkout merge candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/toolpkg_wasm_demo/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install -g pnpm@10.34.5
          npm ci --no-audit --no-fund
          npm --prefix examples/toolpkg_wasm_demo ci --no-audit --no-fund

      - name: Check bundled ToolPkg packages
        shell: bash
        run: |
          set -euo pipefail
          npm run build:examples:github
          git diff --exit-code -- examples/github.js
          npm --prefix examples/toolpkg_wasm_demo run pack:toolpkg
          test -s examples/toolpkg_wasm_demo/main.js
          test -s examples/toolpkg_wasm_demo/modules/core.wasm
          test -s examples/toolpkg_wasm_demo/dist/toolpkg_wasm_demo.toolpkg
          python3 tools/example_packages/sync_example_packages.py --mode test --no-hot-reload
          python3 tools/example_packages/sync_example_packages.py --no-hot-reload

  android-jvm:
    name: Android JVM checks
    needs: [plan, fast-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    if: needs.plan.outputs.android_jvm == 'true'

    steps:
      - name: Checkout merge candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Prepare Android JVM environment
        uses: ./.github/actions/android-checks
        with:
          lane: jvm
          java-version: ${{ env.JAVA_VERSION }}
          android-build-tools-version: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          gradle-cache-read-only: 'true'
          dependency-cache-read-only: 'true'

      - name: Run Android JVM checks
        env:
          INSTRUMENTATION_REQUIRED: ${{ needs.plan.outputs.android_instrumentation }}
        id: jvm-checks
        shell: bash
        run: |
          flags=(--profile --console plain)
          if [[ "$INSTRUMENTATION_REQUIRED" == "true" ]]; then
            flags+=(--instrumentation)
          fi
          bash ci/script/run_android_checks.sh --lane jvm "${flags[@]}"

      - name: Upload JVM profile reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: operit-pr-jvm-profile-${{ github.run_number }}
          path: |
            build/reports/profile/**
            app/build/reports/**
          if-no-files-found: warn
          retention-days: 14

  android-full:
    name: Full Android checks
    needs: [plan, fast-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    if: needs.plan.outputs.android_full == 'true'

    steps:
      - name: Checkout merge candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Prepare Android full environment
        uses: ./.github/actions/android-checks
        with:
          lane: full
          java-version: ${{ env.JAVA_VERSION }}
          android-build-tools-version: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          gradle-cache-read-only: 'true'
          dependency-cache-read-only: 'true'

      - name: Run full Android checks
        env:
          INSTRUMENTATION_REQUIRED: ${{ needs.plan.outputs.android_instrumentation }}
        id: full-checks
        shell: bash
        run: |
          flags=(--profile --console plain)
          if [[ "$INSTRUMENTATION_REQUIRED" == "true" ]]; then
            flags+=(--instrumentation)
          fi
          bash ci/script/run_android_checks.sh --lane full "${flags[@]}"

      - name: Upload full Android profile reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: operit-pr-full-profile-${{ github.run_number }}
          path: |
            build/reports/profile/**
            app/build/reports/**
          if-no-files-found: warn
          retention-days: 14
