name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPS_RELEASE_TAG: deps-v1
      DEPS_CACHE_VERSION: v1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Setup Rust for native ripgrep
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          cache-read-only: false

      - name: Restore vendored dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            app/libs
            app/src/main/jniLibs
            app/src/main/assets/models
            app/src/main/assets/subpack
          key: operit-vendored-deps-${{ env.DEPS_CACHE_VERSION }}

      - name: Download vendored dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release download "$DEPS_RELEASE_TAG" \
            --repo CATMIAOZHI/Operit \
            --pattern 'jniLibs.zip' \
            --pattern 'libs.zip' \
            --pattern 'models.zip' \
            --pattern 'subpack.zip'

          echo '8b973cc604041d6a6801a2040bab8e4f4faf7c7041cba16b6524100a866e99b3  jniLibs.zip' > deps.sha256
          echo 'a9cf963c2bfac4ddaa0e47f66c0adc0fa9084e71c2733d3f8dd84a33957b92d2  libs.zip' >> deps.sha256
          echo '8645d7d56266518e284e672ef9c017013238bec6d057abc1cd0b74686c1efbb8  models.zip' >> deps.sha256
          echo '91e48b1634215c0ba91849d6e2a6353f3edee4e37317f832d1618f09f4f554fd  subpack.zip' >> deps.sha256
          sha256sum -c deps.sha256

          unzip -q -o jniLibs.zip -d .
          unzip -q -o libs.zip -d .
          unzip -q -o models.zip -d .
          unzip -q -o subpack.zip -d .

      - name: Save vendored dependencies cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/libs
            app/src/main/jniLibs
            app/src/main/assets/models
            app/src/main/assets/subpack
          key: operit-vendored-deps-${{ env.DEPS_CACHE_VERSION }}

      - name: Build native ripgrep (.so)
        run: |
          # Find NDK root
          ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          NDK_ROOT=$(ls -d ${ANDROID_HOME}/ndk/*/ | sort -V | tail -1)
          NDK_ROOT=${NDK_ROOT%/}
          if [ -z "$NDK_ROOT" ]; then
            echo "NDK not found, installing..."
            sdkmanager "ndk;27.0.12077973" >/dev/null 2>&1
            NDK_ROOT="${ANDROID_HOME}/ndk/27.0.12077973"
          fi
          echo "NDK_ROOT=$NDK_ROOT"

          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API_LEVEL=26
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${TOOLCHAIN}/aarch64-linux-android${API_LEVEL}-clang"
          export CC_aarch64_linux_android="${TOOLCHAIN}/aarch64-linux-android${API_LEVEL}-clang"
          export CXX_aarch64_linux_android="${TOOLCHAIN}/aarch64-linux-android${API_LEVEL}-clang++"
          export AR_aarch64_linux_android="${TOOLCHAIN}/llvm-ar"

          cd tools/native_ripgrep
          cargo build --release --target aarch64-linux-android

          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/liboperit_ripgrep.so ../../app/src/main/jniLibs/arm64-v8a/
          echo "Built liboperit_ripgrep.so:"
          ls -lh ../../app/src/main/jniLibs/arm64-v8a/liboperit_ripgrep.so

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -x lint --build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: operit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
