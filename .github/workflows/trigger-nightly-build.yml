name: Trigger Nightly Build

# Rebuilds the Nightly dev build by hand. Pushes to dev already start it from sync-operit-mirror.yml
# once the Operit mirror has the commit, because the Nightly build checks out the mirror.
# OperitNightlyRelease only listens for personal-dev-updated; a beta build from main is started with
# its own personal-beta-release.yml instead.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-nightly-build
  cancel-in-progress: false

jobs:
  trigger:
    name: Notify OperitNightlyRelease
    if: github.repository == 'CATMIAOZHI/orbit' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repository_dispatch event
        env:
          GH_TOKEN: ${{ secrets.OPERIT_MIRROR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?OPERIT_MIRROR_TOKEN secret is required}"
          gh api --method POST \
            repos/CATMIAOZHI/OperitNightlyRelease/dispatches \
            -f event_type=personal-dev-updated \
            -F "client_payload[sourceSha]=${{ github.sha }}"
