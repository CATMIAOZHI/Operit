name: Android checks setup
description: Prepare the shared Android CI environment for JVM and full builds
inputs:
  lane:
    description: 'Android check lane (jvm or full)'
    required: true
  java-version:
    description: 'JDK version'
    required: false
    default: '21'
  android-build-tools-version:
    description: 'Android build-tools version'
    required: false
    default: '35.0.0'
  android-ndk-version:
    description: 'Android NDK version (full lane only)'
    required: false
    default: '25.1.8937393'
  android-cmake-version:
    description: 'Android CMake version (full lane only)'
    required: false
    default: '3.31.6'
  manual-deps-dir:
    description: 'Directory for manual Android dependencies'
    required: false
    default: 'manual-deps'
  gradle-cache-read-only:
    description: 'Use Gradle cache in read-only mode'
    required: false
    default: 'true'
  dependency-cache-read-only:
    description: 'Restore manual and native dependency caches without saving them'
    required: false
    default: 'true'
  configure-local-properties:
    description: 'Write a secret-free local.properties file'
    required: false
    default: 'true'
  additional-sdk-packages:
    description: 'Additional sdkmanager packages, one per line'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Validate Android lane
      shell: bash
      env:
        ANDROID_LANE: ${{ inputs.lane }}
      run: |
        case "$ANDROID_LANE" in
          jvm|full) ;;
          *) echo "Unsupported Android lane: $ANDROID_LANE" >&2; exit 2 ;;
        esac

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'

    - name: Set up JDK
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Set up Gradle cache
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      with:
        cache-read-only: ${{ inputs.gradle-cache-read-only }}
        cache-cleanup: on-success

    - name: Set up Android SDK
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

    - name: Install required Android toolchain
      shell: bash
      env:
        ANDROID_BUILD_TOOLS_VERSION: ${{ inputs.android-build-tools-version }}
        ANDROID_NDK_VERSION: ${{ inputs.android-ndk-version }}
        ANDROID_CMAKE_VERSION: ${{ inputs.android-cmake-version }}
        ADDITIONAL_SDK_PACKAGES: ${{ inputs.additional-sdk-packages }}
      run: |
        set -euo pipefail
        packages=("build-tools;$ANDROID_BUILD_TOOLS_VERSION" "platform-tools" "platforms;android-34" "platforms;android-36")
        if [[ "${{ inputs.lane }}" == "full" ]]; then
          packages+=("ndk;$ANDROID_NDK_VERSION" "cmake;$ANDROID_CMAKE_VERSION")
        fi
        while IFS= read -r package; do
          [[ -n "$package" ]] && packages+=("$package")
        done <<< "$ADDITIONAL_SDK_PACKAGES"
        sdkmanager --install "${packages[@]}"

    - name: Initialize terminal submodule
      shell: bash
      run: |
        set -euo pipefail
        git submodule sync -- terminal
        git submodule update --init --recursive --depth 1 terminal
        git submodule status -- terminal

    - name: Configure secret-free Android build
      if: inputs.configure-local-properties == 'true'
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "sdk.dir=$ANDROID_HOME"
          echo 'GITHUB_CLIENT_ID='
          echo 'GITHUB_CLIENT_SECRET='
        } > local.properties

    - name: Restore Android dependency cache
      id: cache-manual-deps
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ inputs.manual-deps-dir }}
        key: android-${{ inputs.lane }}-deps-${{ runner.os }}-${{ hashFiles('ci/script/download_android_dependencies.sh', 'ci/script/prepare_android_dependencies.py') }}

    - name: Download Android dependencies
      if: steps.cache-manual-deps.outputs.cache-hit != 'true'
      shell: bash
      run: bash ci/script/download_android_dependencies.sh "${{ inputs.lane }}" "${{ inputs.manual-deps-dir }}"

    - name: Prepare Android dependencies
      shell: bash
      run: |
        python3 ci/script/prepare_android_dependencies.py \
          --profile "${{ inputs.lane }}" \
          --archives "${{ inputs.manual-deps-dir }}" \
          --repository "$GITHUB_WORKSPACE"

    - name: Save Android dependency cache
      if: inputs.dependency-cache-read-only != 'true' && steps.cache-manual-deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ inputs.manual-deps-dir }}
        key: android-${{ inputs.lane }}-deps-${{ runner.os }}-${{ hashFiles('ci/script/download_android_dependencies.sh', 'ci/script/prepare_android_dependencies.py') }}

    - name: Restore native ripgrep cache
      id: cache-native-ripgrep
      if: inputs.lane == 'full'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          tools/native_ripgrep/target
        key: native-ripgrep-arm64-${{ runner.os }}-${{ hashFiles('tools/native_ripgrep/Cargo.lock') }}

    - name: Build native ripgrep
      if: inputs.lane == 'full'
      shell: bash
      env:
        ANDROID_NDK_VERSION: ${{ inputs.android-ndk-version }}
      run: |
        set -euo pipefail
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
        export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
        rustup toolchain install 1.88.0 --profile minimal
        rustup target add --toolchain 1.88.0 aarch64-linux-android
        cargo +1.88.0 build \
          --manifest-path tools/native_ripgrep/Cargo.toml \
          --release \
          --target aarch64-linux-android \
          --locked
        install -Dm755 \
          tools/native_ripgrep/target/aarch64-linux-android/release/liboperit_ripgrep.so \
          app/src/main/jniLibs/arm64-v8a/liboperit_ripgrep.so
        test -s app/src/main/jniLibs/arm64-v8a/liboperit_ripgrep.so

    - name: Save native ripgrep cache
      if: inputs.lane == 'full' && inputs.dependency-cache-read-only != 'true' && steps.cache-native-ripgrep.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          tools/native_ripgrep/target
        key: native-ripgrep-arm64-${{ runner.os }}-${{ hashFiles('tools/native_ripgrep/Cargo.lock') }}
